<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff; --paper-2: #f4f4f5; --card: #ffffff; --ink: #09090b; --ink-2: #3f3f46; --ink-3: #71717a;
  --line: #e4e4e7; --sketch: #18181b; --mark: #ffec99; --accent: #09090b; --accent-soft: #f4f4f5; --accent-ink: #fafafa;
  --otto: #0ca678; --otto-soft: #d3f9ea; --you: #b08800; --you-soft: #fff3bf;
  --good: #2b8a3e; --good-soft: #d3f9d8; --amber: #d9480f; --amber-soft: #fff4e6; --red: #e03131; --red-soft: #ffe3e3;
  --display: "Kalam", "Comic Neue", cursive;
  --sans: "Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
  --wobble: 255px 12px 225px 12px / 12px 225px 12px 255px;
  --wobble-sm: 14px 4px 12px 4px / 4px 12px 4px 14px;
  --ink-shadow: 2px 2px 0 0 var(--sketch);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0b0b0c; --paper-2: #18181b; --card: #111113; --ink: #fafafa; --ink-2: #d4d4d8; --ink-3: #a1a1aa;
    --line: #27272a; --sketch: #d4d4d8; --mark: #5c4a00; --accent: #fafafa; --accent-soft: #18181b; --accent-ink: #09090b;
    --otto: #38d9a9; --otto-soft: #0f3a2e; --you: #ffd43b; --you-soft: #3a3210;
    --good: #69db7c; --good-soft: #1b3a22; --amber: #ff922b; --amber-soft: #3a2410; --red: #ff8787; --red-soft: #3d1a1a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0b0b0c; --paper-2: #18181b; --card: #111113; --ink: #fafafa; --ink-2: #d4d4d8; --ink-3: #a1a1aa;
  --line: #27272a; --sketch: #d4d4d8; --mark: #5c4a00; --accent: #fafafa; --accent-soft: #18181b; --accent-ink: #09090b;
  --otto: #38d9a9; --otto-soft: #0f3a2e; --you: #ffd43b; --you-soft: #3a3210;
  --good: #69db7c; --good-soft: #1b3a22; --amber: #ff922b; --amber-soft: #3a2410; --red: #ff8787; --red-soft: #3d1a1a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: 0.88em var(--mono); background: var(--paper-2); padding: 1px 5px; border-radius: 4px; }

.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 20; }
.progress > div { height: 100%; width: 100%; background: var(--ink); transform: scaleX(0); transform-origin: 0 50%; transition: transform .15s linear; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1200px; margin: 0 auto; gap: 56px; padding: 0 24px; }
nav.toc { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 40px 0 24px; }
nav.toc .brand { font: 700 17px/1.3 var(--display); letter-spacing: 0; color: var(--ink); margin-bottom: 20px; display: flex; gap: 8px; align-items: center; }
nav.toc .brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 1.5px var(--sketch); display: inline-block; }
nav.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: l; }
nav.toc li a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
nav.toc li a:hover { background: var(--paper-2); color: var(--ink); }
nav.toc li a.active { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
nav.toc li a .n { font: 500 11px var(--mono); color: var(--ink-3); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--paper-2); flex: none; }
nav.toc li a.active .n { background: var(--mark); color: var(--ink); box-shadow: 0 0 0 1.5px var(--sketch); }
nav.toc li a .done { margin-left: auto; color: var(--good); font-size: 12px; }
.theme-btn { margin-top: 20px; background: none; border: 1px solid var(--line); color: var(--ink-2); font: 13px var(--sans); padding: 6px 10px; border-radius: 8px; cursor: pointer; }

main { padding: 56px 0 120px; min-width: 0; }
header.hero { padding-bottom: 32px; margin-bottom: 8px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { font: 700 clamp(38px, 5.6vw, 64px)/1.05 var(--display); letter-spacing: -0.01em; margin: 14px 0 16px; text-wrap: balance; }
.lede { font-size: 19px; color: var(--ink-2); max-width: 64ch; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stats > div { background: var(--card); padding: 16px 18px; border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); box-shadow: var(--ink-shadow); }
.stats .v { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats .l { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
header.hero .stats { margin-top: 26px; }

section.lesson { padding: 64px 0 8px; scroll-margin-top: 16px; border-top: 1px solid var(--line); }
section.lesson:first-of-type { border-top: 0; }
.kicker { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h2 { font: 700 clamp(30px, 3.8vw, 42px)/1.1 var(--display); letter-spacing: -0.005em; margin: 10px 0 18px; text-wrap: balance; }
h2 span.mk { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 4px; }
h3 { font: 600 16px/1.35 var(--sans); margin: 0 0 6px; }
.idea { font: 500 19px/1.5 var(--sans); color: var(--ink); max-width: 64ch; margin: 0 0 28px; }
.block { margin: 0 0 28px; }
.block p { margin: 0 0 12px; max-width: 70ch; }
.block-title { font: 600 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.card p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.tag { display: inline-block; font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--paper-2); color: var(--ink-2); margin-bottom: 10px; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }

.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fields > div { background: var(--card); padding: 14px 16px; }
.fields .k { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.fields .v { font-size: 15px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--sans); color: var(--ink-3); background: var(--paper-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.caption { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

.callout { border-radius: var(--r); padding: 16px 18px; border-left: 4px solid; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; }
.callout .t { font-weight: 600; margin-bottom: 4px; }
.callout p { margin: 0; font-size: 15px; }
.callout p + p, .exercise p + p { margin-top: 8px; }
.callout.trap { border-color: var(--red); } .callout.trap .t { color: var(--red); }
.callout.tip { border-color: var(--good); } .callout.tip .t { color: var(--good); }
.callout.warning { border-color: var(--red); } .callout.warning .t { color: var(--red); }

.principle { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; background: var(--you-soft); border: 1.5px solid var(--sketch); border-radius: var(--wobble); padding: 18px 20px; box-shadow: var(--ink-shadow); }
.principle .badge { font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--card); border: 1.5px solid var(--sketch); border-radius: 999px; padding: 6px 9px; white-space: nowrap; }
.principle h3 { font: 700 20px/1.25 var(--display); margin: 0 0 4px; }
.principle p { margin: 0; color: var(--ink-2); font-size: 15px; }
.principle .src { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

/* charts */
.chart { background: var(--card); border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); padding: 18px 20px; box-shadow: var(--ink-shadow); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 14px; }
.bar-row .lb { color: var(--ink); }
.bar-row .lb small { display: block; color: var(--ink-3); font-size: 12.5px; }
.bar-row .tr { height: 12px; background: var(--paper-2); border-radius: 99px; overflow: hidden; border: 1.5px solid var(--sketch); }
.bar-row .fl { height: 100%; background: var(--ink); }
.bar-row .fl.t-amber { background: var(--red); } .bar-row .fl.t-red { background: var(--red); } .bar-row .fl.t-good { background: var(--good); } .bar-row .fl.t-otto { background: var(--ink-3); }
.bar-row .vl { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

.funnel { display: grid; gap: 8px; }
.fn-row { display: grid; grid-template-columns: minmax(0, 1fr); }
.fn-bar { margin: 0 auto; background: var(--ink); color: var(--accent-ink); border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); padding: 10px 14px; display: flex; justify-content: space-between; gap: 12px; min-width: 180px; max-width: 100%; }
.fn-bar b { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.fn-bar span { font-size: 13.5px; align-self: center; }
.fn-row:nth-child(2) .fn-bar { background: var(--ink-2); }
.fn-row:nth-child(3) .fn-bar { background: var(--ink-3); }
.fn-row:last-child .fn-bar { background: var(--mark); color: var(--ink); }
.fn-note { text-align: center; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }

.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px dashed var(--sketch); }
.timeline li { position: relative; padding: 0 0 18px 16px; }
.timeline li::before { content: ""; position: absolute; left: -26px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--mark); border: 1.5px solid var(--sketch); }
.timeline .d { font: 500 12px var(--mono); color: var(--ink-3); }
.timeline .h { font-weight: 600; margin: 2px 0; }
.timeline .x { font-size: 14px; color: var(--ink-2); }

.matrix { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background:
  linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100% no-repeat, linear-gradient(90deg, var(--line), var(--line)) 0 50% / 100% 1px no-repeat, var(--card); }
.mx-q { position: absolute; font: 600 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; }
.mx-q.tl { top: 0; left: 0; } .mx-q.tr { top: 0; right: 0; color: var(--good); } .mx-q.bl { bottom: 0; left: 0; } .mx-q.br { bottom: 0; right: 0; }
.mx-dot { position: absolute; transform: translate(-50%, 50%); display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; color: var(--ink); }
.mx-dot i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--card); }
.mx-axes { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }

.stack { display: grid; gap: 6px; }
.st-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 110px; gap: 12px; align-items: center; background: var(--card); border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); padding: 12px 14px; }
.st-row .no { font: 600 12px var(--mono); color: var(--ink-3); }
.st-row .nm { font-weight: 600; }
.st-row .dt { font-size: 13.5px; color: var(--ink-2); }
.st-row .ow { font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; text-align: center; border-radius: 999px; padding: 6px 8px; }
.st-row.o-course { border-left-width: 5px; } .st-row.o-course .ow { background: var(--ink); color: var(--accent-ink); }
.st-row.o-otto { border-left: 5px solid var(--otto); } .st-row.o-otto .ow { background: var(--otto-soft); color: var(--ink); border: 1.5px solid var(--otto); }
.st-row.o-you { border-left: 5px solid var(--you); } .st-row.o-you .ow { background: var(--mark); color: var(--ink); border: 1.5px solid var(--sketch); }
.st-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.st-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.signals { display: grid; gap: 12px; }
.signal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.signal .watch { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
.signal .why { font-size: 14px; margin: 0; }
.signal .ex { margin-top: 10px; font-size: 13.5px; background: var(--paper-2); border-radius: 8px; padding: 8px 10px; color: var(--ink-2); }
.signal .ex b { color: var(--ink); }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { border-radius: var(--r); padding: 16px 18px; border: 1px solid var(--line); background: var(--card); }
.compare .lbl { font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.compare .bad .lbl { color: var(--red); } .compare .good .lbl { color: var(--good); }
.compare .bad { border-top: 3px solid var(--red); } .compare .good { border-top: 3px solid var(--good); }
.compare .body { white-space: pre-wrap; font-size: 14.5px; }
.compare .notes { margin-top: 12px; font-size: 13px; color: var(--ink-3); }

.lab-bars { display: grid; gap: 12px; margin-bottom: 14px; }
.lab-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: center; font-size: 14px; }
.lab-row .name { font-weight: 600; }
.lab-row .bars2 { display: grid; gap: 4px; }
.bar { height: 10px; border-radius: 99px; background: var(--ink); min-width: 3px; }
.bar.t { background: var(--ink-3); }
.bar-l { font: 12px var(--mono); color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.outputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.outputs .card pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); margin: 8px 0 0; color: var(--ink-2); max-height: 240px; overflow: auto; }
.score { font: 700 13px var(--mono); color: var(--ink); background: var(--mark); padding: 1px 5px; border-radius: 4px; }

.pipeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.pipe-step { flex: 1 1 140px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.pipe-step .ic { font-size: 20px; }
.pipe-step .lb { font-weight: 600; margin: 6px 0 4px; }
.pipe-step .dt { font-size: 13px; color: var(--ink-2); }
.pipe-arrow { align-self: center; color: var(--ink-3); font-size: 18px; }

pre.code { background: #0f1729; color: #e8edf7; border-radius: var(--r); padding: 16px 18px; overflow-x: auto; font: 13px/1.6 var(--mono); margin: 0; }
pre.code code { background: none; color: inherit; padding: 0; font: inherit; }
ol.steps { margin: 0; padding-left: 22px; } ol.steps li { margin-bottom: 8px; }
.exercise { background: var(--you-soft); border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); padding: 16px 18px; }
.exercise .t { color: var(--ink); font-weight: 700; margin-bottom: 4px; }
.exercise p { margin: 0; }

.quiz { background: var(--card); border: 1.5px solid var(--sketch); border-radius: var(--wobble-sm); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--ink-shadow); }
.quiz .q { font-weight: 600; margin-bottom: 12px; }
.quiz button.opt { display: block; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font: 15px var(--sans); cursor: pointer; }
.quiz button.opt:hover:not([disabled]) { border-color: var(--accent); }
.quiz button.opt.right { border-color: var(--good); background: var(--good-soft); }
.quiz button.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.quiz button.opt[disabled] { cursor: default; }
.quiz .why { display: none; font-size: 14.5px; color: var(--ink-2); margin-top: 6px; }
.quiz.answered .why { display: block; }

.term { border-bottom: 1px dashed var(--ink-3); cursor: help; position: relative; }
.term:hover::after, .term:focus::after { content: attr(data-def); position: absolute; left: 0; top: 130%; z-index: 10; width: min(300px, 70vw); background: var(--ink); color: var(--paper); font: 13px/1.45 var(--sans); padding: 9px 11px; border-radius: 8px; }
sup.src a { font: 11px var(--mono); text-decoration: none; }
footer.sources { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
footer.sources ol { padding-left: 22px; } footer.sources li { margin-bottom: 4px; word-break: break-word; }
.credit { margin-top: 28px; font-size: 13px; color: var(--ink-3); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 16px; }
  nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; height: auto; padding: 10px 0; background: var(--paper); border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.toc .brand, .theme-btn { display: none; }
  nav.toc ol { display: flex; gap: 4px; }
  nav.toc li a { white-space: nowrap; padding: 6px 8px; }
  nav.toc li a .t { display: none; }
  main { padding-top: 32px; }
  .signal, .compare, .principle { grid-template-columns: 1fr; }
  .lab-row, .bar-row { grid-template-columns: 1fr; gap: 4px; }
  .bar-row .vl { text-align: left; }
  .st-row { grid-template-columns: 26px minmax(0, 1fr); }
  .st-row .ow { grid-column: 2; justify-self: start; }
  .matrix { aspect-ratio: 1 / 1; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><div id="progress"></div></div>
<div class="layout">
  <nav class="toc" aria-label="Lessons">
    <div class="brand"><i aria-hidden="true"></i>agentic-gtm</div>
    <ol id="toc"></ol>
    <button class="theme-btn" id="theme" type="button">Toggle theme</button>
  </nav>

<script id="course-data" type="application/json">{"title": "How to sell Lindus", "lede": "Lindus stopped selling trials in August 2026 and now buys drug assets, so the \"customer\" to win is a biotech that owns a chronic-disease drug and can't fund the next trial alone.", "company": {"name": "Lindus Therapeutics", "url": "https://www.lindushealth.com", "one_liner": "Next-generation drug developer that in-licenses clinical-stage assets and runs the trials itself."}, "meta": [{"label": "accounts checked", "value": "30"}, {"label": "kept", "value": "15"}, {"label": "live signals", "value": "9"}, {"label": "sources", "value": "58"}], "glossary": {"ICP": "Ideal customer profile: the kind of company that buys, and why. For Lindus, the kind of company that would hand over a drug asset.", "persona": "A specific person inside the target company, described by role, what they own and why they would care.", "buying signal": "Something you can see from outside that makes the need urgent now, like a readout, a funding gap or a pivot.", "licensor": "The company that owns a drug asset and grants the rights to develop it to someone else. Lindus's real customer.", "in-licensing": "Taking the rights to someone else's drug asset, usually for an upfront fee, milestones and royalties.", "CVR": "Contingent value right: a promise to pay former shareholders if an asset later earns money, often used when a company plans to sell an asset.", "ex-APAC rights": "The rights to a drug everywhere except Asia-Pacific, the deal type an Asian drug owner offers a Western partner.", "champion": "The person inside the account who wants the deal and pushes it internally.", "economic buyer": "The person who can say yes and sign. In a small biotech that is usually the CEO with the board."}, "sources": [{"id": "s1", "title": "Lindus Therapeutics home", "url": "https://www.lindushealth.com"}, {"id": "s2", "title": "Lindus news archive", "url": "https://www.lindushealth.com/news"}, {"id": "s3", "title": "Dr. G I-III ready assets\" in \"non-ultrarare chronic disease\" and funds the first deals from its own balance sheet [s1]. So the old buyer, a trial sponsor, is now someone else's customer."}, {"type": "bars", "heading": "Where Lindus has proof it can run trials", "items": [{"label": "Psychiatry and sleep", "value": 3}, {"label": "Cardiometabolic", "value": 3}, {"label": "Dermatology", "value": 2}, {"label": "Women's health", "value": 2}, {"label": "Other chronic (ME/CFS, tinnitus)", "value": 2}, {"label": "Respiratory", "value": 1}, {"label": "Oncology diagnostics", "value": 1, "tone": "amber"}], "unit": " trials", "caption": "The 14 sponsor trials Lindus announced on its own news page, by area [s2]. Only 3 were drug trials; most were devices and digital therapeutics."}, {"type": "principle", "name": "Beachhead market", "body": "For Lindus the beachhead is small Western biotechs with a Phase 2-ready chronic-disease drug and not enough cash for the next trial. They have the most reason to take a partner that runs the trial, and they match every line of Lindus's own brief [s1, s3]. Asian owners offering {{ex-APAC rights}} are the second lane, not the first.", "source": "Geoffrey Moore, *Crossing the Chasm*"}, {"type": "callout", "tone": "tip", "title": "The decision, and why", "body": "Four segments were on the table: old trial sponsors, big pharma pruning its pipeline, small biotechs short of cash, and Asian drug owners. Sponsors went to Curavit with the CRO [s4], and big pharma runs auctions that an $80M balance sheet rarely wins (our judgement). Small biotechs fit Lindus's stated rule of \"in-licensing programs after early clinical readouts\" [s3], so they come first."}, {"type": "fields", "heading": "The {{ICP}} card: the {{licensor}}", "items": [{"label": "Who", "value": "Clinical-stage biotechs (and some pharma) that own a drug with human data, typically Phase 2-ready [s1]"}, {"label": "Disease areas", "value": "Non-ultrarare chronic disease where Lindus has run trials: cardiometabolic, respiratory, psychiatry, dermatology, women's health [s1, s2]"}, {"label": "Size", "value": "Small caps and venture-backed privates with roughly a year of cash or less, or a pivot away from the asset"}, {"label": "Regions", "value": "Owner anywhere; the trial runs in the US, UK and Europe [s1]"}, {"label": "The pain, in their words", "value": "\"Subject to receipt of additional financing\" [s14]; \"to be divested or partnered\" [s17]"}, {"label": "Not a fit", "value": "Acquired or being acquired; cash-rich and running its own next trial; rare disease or oncology; bankrupt; no human data"}, {"label": "Why now", "value": "Lindus is targeting deal close on its first assets through 2026 [s1]"}]}, {"type": "cards", "heading": "The {{persona}} cards: who is in a licensing deal", "items": [{"title": "CEO", "body": "Owns the runway and the story to investors. Cares whether a deal funds the next value step without a dilutive raise.", "tag": "Signs", "tone": "accent"}, {"title": "Chief Business Officer or head of BD", "body": "Runs the partnering process and the data room. Cares about a credible partner who can close fast.", "tag": "Champion", "tone": "amber"}, {"title": "Chief Medical Officer", "body": "Judges whether Lindus can run the next trial well. Cares about enrollment speed and data quality, where Lindus has a record [s1].", "tag": "Evaluates"}, {"title": "Board and lead investor", "body": "Want value from the asset. Often push for a partner when cash is short.", "tag": "Influences"}]}, {"type": "callout", "tone": "trap", "title": "Your own website is trap number one", "body": "The home page says Lindus Therapeutics with a team of 80 [s1], but the leadership page still says \"Lindus is a next-generation CRO\" and \"Over 160 people\" [s7]. A biotech CEO who clicks through will wonder which company is writing to them. Fix or redirect the old pages before any outreach."}], "quiz": [{"q": "A small biotech's CMO loves how Lindus runs trials. Who most likely signs the licence?", "options": ["The CMO", "The CEO, with the board", "The head of clinical operations", "The lead investigator at the trial site"], "answer": 1, "why": "In a small biotech the CEO and board own the runway and the asset, so they sign. The CMO is the one who can block it on trial quality."}, {"q": "Which company is outside the beachhead?", "options": ["A Swedish biotech with Phase 2a obesity data and one funded trial", "A US biotech with a positive Phase 2 in asthma and a year of cash", "A trial sponsor that used Lindus as its CRO in 2024 and wants another trial run", "A biotech shelving a Phase 3 acne drug after a pivot"], "answer": 2, "why": "Running trials for sponsors is now Curavit's business [s4]. The other three own assets and have a reason to take a partner."}]}, {"id": "where", "nav": "Where they are", "kicker": "Lesson 2", "title": "Where are they?", "idea": "A target list is only useful if every row is a company that could actually hand Lindus an asset this year. Most wrong rows come from a few traps you can check for.", "blocks": [{"type": "funnel", "stages": [{"label": "Candidates researched", "value": 30}, {"label": "Still independent and operating", "value": 27}, {"label": "Fit the ICP on the facts", "value": 18}, {"label": "Settled and kept", "value": 15}], "caption": "Counts from this run. The 15 dropped companies and their sources are in research.md."}, {"type": "bars", "heading": "Why 15 were dropped", "items": [{"label": "Cash-rich, running its own next trial", "value": 6, "tone": "amber"}, {"label": "Rare disease or oncology focus", "value": 3, "tone": "amber"}, {"label": "Could not settle", "value": 3, "tone": "red"}, {"label": "Acquired by a bigger company", "value": 2, "tone": "red"}, {"label": "Bankrupt, assets sold", "value": 1, "tone": "red"}], "unit": ""}, {"type": "principle", "name": "Tier your accounts", "body": "Not every licensor deserves a letter this week. A fresh readout plus a short runway, like Connect's, gets a personal note now; a good asset with no trigger, like Gesynta's, goes on the watch list. The matrix below places each account only on dated evidence."}, {"type": "table", "heading": "The 15 accounts", "columns": ["Company", "Location", "Segment", "Why it fits", "Why now", "Check"], "rows": [["[Connect Biopharma](https://www.connectbiopharma.com)", "San Diego, US", "Respiratory", "Anti-IL-4R antibody, positive Phase 2 in acute asthma [s38]", "Readout 15 Sep; ~1 year of cash [s39]", "✓ domain, independent"], ["[Skye Bioscience](https://skyebioscience.com)", "San Diego, US", "Cardiometabolic", "Phase 2a obesity antibody to be divested or partnered [s17]", "Redx deal 14 Aug [s17]", "✓ domain (bot wall), asset for sale"], ["[Reviva Pharmaceuticals](https://revivapharma.com)", "Cupertino, US", "Psychiatry", "Schizophrenia drug, one Phase 3 done, second needed [s14]", "Phase 3 \"subject to financing\", 12 Aug [s14]", "✓ domain (bot wall), independent"], ["[Pila Pharma](https://pilapharma.com)", "Malmö, SE", "Cardiometabolic", "Oral obesity drug, two Phase 2a trials done [s12]", "EMA approval 18 Aug; more capital needed [s13]", "✓ domain; ex-Lindus sponsor [s10]"], ["[D&D Pharmatech](https://ddpharmatech.com)", "Seongnam, KR", "Cardiometabolic", "MASH drug hit Phase 2 biopsy endpoints [s34]", "CEO wants ex-China deal by year-end [s34]", "✓ domain; China rights at Salubris [s35]"], ["[Corbus Pharmaceuticals](https://www.corbuspharma.com)", "Norwood, US", "Cardiometabolic", "Oral CB1 drug, 5% weight loss in Phase 1b [s21]", "Readout 14 Sep [s21]", "✓ domain; no stated partner search"], ["[Vistagen](https://vistagen.com)", "S. San Francisco, US", "Women's health", "Phase 2-ready non-hormonal hot-flash drug [s20]", "Phase 3 miss 30 Jun; new BD chief [s19, s20]", "✓ domain (bot wall), independent"], ["[Dermata Therapeutics](https://www.dermatarx.com)", "San Diego, US", "Dermatology", "Positive Phase 3 acne drug, shelved after consumer pivot [s16]", "Program paused [s16]", "✓ domain, independent"], ["[Sciwind Biosciences](https://sciwindbio.com)", "Hangzhou, CN", "Cardiometabolic", "Injectable GLP-1 approved in China, rights abroad open [s30]", "\"Deep discussions\" abroad, 7 Jun [s31]", "✓ domain; oral already at Verdiva [s29]"], ["[Yarrow Bioscience (ex-VYNE)](https://yarrowbioscience.com)", "Bridgewater, US", "Dermatology", "Legacy psoriasis drug may be sold or licensed [s27]", "Merger closing late Jul; old domain redirects [s28]", "✓ renamed; not yarrowbio.com [s58]"], ["[MetaVia](https://metaviatx.com)", "Cambridge, US", "Cardiometabolic", "GLP-1/glucagon drug, up to 9.1% weight loss in Phase 1 [s22]", "16-week data due Q4 [s23]", "✓ domain; licensed from Dong-A ST [s23]"], ["[Aclaris Therapeutics](https://aclaristx.com)", "Wayne, US", "Respiratory", "Asthma antibodies in Phase 1b/2 [s25]", "Seeking respiratory partners outside China [s26]", "✓ domain, independent"], ["[Gesynta Pharma](https://www.gesynta.se)", "Stockholm, SE", "Women's health", "Non-hormonal endometriosis drug in Phase 2 [s36]", "Half randomised; readout later [s36]", "✓ domain, independent"], ["[HighTide Therapeutics](https://www.hightidetx.com)", "Shenzhen, CN / Rockville, US", "Cardiometabolic", "Three Phase 3s done in type 2 diabetes in China [s24]", "None dated", "✓ domain, HKEX listed"], ["[Tiefenbacher Group](https://tiefenbacher-pharmaceuticals.com)", "Germany", "Other chronic", "Sponsor of a Phase 2 in ME/CFS; family owned [s33]", "None dated", "✓ domain; ex-Lindus sponsor [s11]"]], "caption": "Checked 24 September 2026. \"Bot wall\" means the site blocked automated fetches; the company was confirmed through its own investor releases."}, {"type": "matrix", "x": {"label": "Fit", "low": "weaker", "high": "stronger"}, "y": {"label": "Timing"}, "quadrants": {"tr": "Write now", "br": "Watch", "tl": "Timing, weaker fit", "bl": "Later"}, "items": [{"label": "Connect", "x": 0.85, "y": 0.95}, {"label": "Skye", "x": 0.78, "y": 0.9}, {"label": "Reviva", "x": 0.72, "y": 0.85}, {"label": "Pila", "x": 0.8, "y": 0.8}, {"label": "D&D", "x": 0.88, "y": 0.72}, {"label": "Corbus", "x": 0.6, "y": 0.82}, {"label": "Vistagen", "x": 0.68, "y": 0.6}, {"label": "Dermata", "x": 0.66, "y": 0.52}, {"label": "Sciwind", "x": 0.55, "y": 0.64}, {"label": "Gesynta", "x": 0.8, "y": 0.25}, {"label": "HighTide", "x": 0.58, "y": 0.18}, {"label": "Tiefenbacher", "x": 0.45, "y": 0.15}]}, {"type": "callout", "tone": "trap", "title": "Acquired while you were researching", "body": "Terns had put its obesity assets up for partnering [s40], which looks like a perfect lead. Then Merck completed its acquisition of Terns on 5 May 2026 [s41]. AtaiBeckley, the former employer of Lindus's own VP of Corporate Development, is now part of Lilly too [s42]."}, {"type": "callout", "tone": "trap", "title": "A new name, and a lookalike domain", "body": "VYNE Therapeutics merged into Yarrow Bioscience, and vynetherapeutics.com now redirects to yarrowbioscience.com [s28]. yarrowbio.com is a different, empty \"Coming Soon\" site [s58]. Put the redirecting domain in the table, not the one a search suggests."}, {"type": "callout", "tone": "trap", "title": "A competitor is already in", "body": "Sciwind licensed the oral version of its GLP-1 outside China to Verdiva Bio [s29], a company that also builds a pipeline by licensing assets. Only the injectable's rights abroad are still open [s31, s32]. Pitch the asset that is actually available."}, {"type": "callout", "tone": "trap", "title": "Closed, and the assets belong to someone else", "body": "Mithra's menopause drug fits the women's health brief perfectly. But Mithra went bankrupt in 2024 and Gedeon Richter owns its estetrol assets [s43]. Old directories still list Mithra as a developer."}, {"type": "callout", "tone": "trap", "title": "Rich companies don't need you", "body": "Upstream Bio has $261M and is starting its own Phase 3s [s44]; Altimmune has $535M [s45]. A great asset with a funded owner is not a lead. Six of the 15 drops were this."}, {"type": "steps", "heading": "The checks, in order", "items": ["Open the domain. Confirm name, drug and location match; follow redirects and note renames.", "Search \"<company> acquired\" and \"<company> merger\", newest first. Drop anything bought or being bought.", "Check it is still operating: a filing, results release or trial update from the last 90 days.", "Read the latest quarterly release for cash runway and who funds the next trial.", "Check the asset's rights: who already holds China, Asia or global rights?", "Confirm the disease area is chronic and not rare, and that the drug has human data.", "If any check can't be settled, drop the row and write down why."]}], "quiz": [{"q": "Two sites come up for \"Yarrow\": yarrowbio.com and yarrowbioscience.com. Which check settles which one is the ex-VYNE company?", "options": ["Pick the shorter domain", "Open the old company's domain and see where it redirects", "Search the CEO's name", "Pick the one with more pages"], "answer": 1, "why": "vynetherapeutics.com redirects to yarrowbioscience.com [s28]. The other domain is an unrelated empty page [s58]."}, {"q": "A biotech has a great Phase 2 obesity asset and $400M in the bank. Where does it go?", "options": ["Write now", "Watch list or drop: funded owners rarely license out", "Top of the list: big budgets mean big deals", "Hand it to the agent"], "answer": 1, "why": "Lindus needs owners who can't or won't fund the next trial. Cash-rich owners run it themselves, like Upstream Bio [s44]."}]}, {"id": "when", "nav": "When ready", "kicker": "Lesson 3", "title": "When are they ready?", "idea": "The same biotech says no in March and yes in September. A {{buying signal}} is a public event that makes the owner need a partner now: fresh data, a funding gap, a pivot.", "blocks": [{"type": "principle", "name": "Trigger events", "body": "Lindus says it in-licenses \"after early clinical readouts\" [s3], which is itself the trigger. A readout raises the asset's value while the owner's cash stays the same. Write in the week of the readout, not the week you finished your list."}, {"type": "timeline", "heading": "Dated signals on the 15 accounts", "items": [{"date": "2026-09-15", "title": "Connect Biopharma", "note": "Positive Phase 2: 66% fewer treatment failures in acute asthma [s38]"}, {"date": "2026-09-14", "title": "Corbus", "note": "Phase 1b obesity readout, Phase 2 planned for H1 2027 [s21]"}, {"date": "2026-08-18", "title": "Pila Pharma", "note": "EMA approves 12-week obesity trial; analysts expect more capital needed [s12, s13]"}, {"date": "2026-08-14", "title": "Skye Bioscience", "note": "Redx deal; nimacimab to be divested or partnered [s17]"}, {"date": "2026-08-12", "title": "Reviva", "note": "Phase 3 start moved to H1 2027, subject to financing [s14]"}, {"date": "2026-06-30", "title": "Vistagen", "note": "Phase 3 miss in social anxiety [s19]"}, {"date": "2026-06-18", "title": "D&D Pharmatech", "note": "CEO targets a licensing deal outside China by year-end [s34]"}, {"date": "2026-06-15", "title": "Vistagen", "note": "New Chief Corporate Development Officer with licensing background [s20]"}, {"date": "2026-06-07", "title": "Sciwind", "note": "In \"deep discussions\" for deals outside China [s31]"}]}, {"type": "signals", "items": [{"name": "Asset put up for sale or partnering", "watch": "\"Divest\", \"strategic alternatives\", a CVR tied to one asset, or a pivot away from a disease area in a release or 8-K", "why": "The owner has already decided not to fund the asset. The only question is who takes it.", "example": {"company": "Skye Bioscience", "fact": "Nimacimab to be divested or partnered, with proceeds to former holders via a {{CVR}} [s17]", "date": "2026-08-14"}}, {"name": "Early readout, thin runway", "watch": "A Phase 1b or 2 topline release in the same quarter as a runway of about a year or less", "why": "The asset just got more valuable and the next trial just got more expensive. That is when a trial-running partner looks best.", "example": {"company": "Connect Biopharma", "fact": "Positive Phase 2 in acute asthma; $31.5M cash, about one year of runway [s38, s39]", "date": "2026-09-15"}}, {"name": "Next trial \"subject to financing\"", "watch": "That phrase, or \"pending additional capital\", in a quarterly release or 10-Q", "why": "They are telling investors they can't start without new money. A partner is the alternative to a dilutive raise.", "example": {"company": "Reviva Pharmaceuticals", "fact": "RECOVER-2 enrollment pushed to H1 2027, subject to additional financing [s14]", "date": "2026-08-12"}}, {"name": "New business development leader", "watch": "Appointment of a Chief Business or Corporate Development Officer", "why": "A new BD chief builds a partner list in the first 90 days.", "example": {"company": "Vistagen", "fact": "Appointed a Chief Corporate Development Officer with licensing experience [s20]", "date": "2026-06-15"}}, {"name": "Asian owner seeking a partner outside Asia", "watch": "Local business press or English releases about licensing rights outside China or Korea", "why": "This is the {{ex-APAC rights}} deal Lindus lists on its own site [s1].", "example": {"company": "D&D Pharmatech", "fact": "CEO says the aim is a licensing deal for DD01 by year-end [s34]", "date": "2026-06-18"}}]}, {"type": "callout", "tone": "warning", "title": "Signals go stale", "body": "Most of these are worth acting on for 30 to 90 days. Vistagen's BD hire is already 101 days old today, so lead with its June Phase 3 news instead, or wait for the next trigger. D&D's is different: it lasts until they sign someone."}], "quiz": [{"q": "Which of these is a buying signal for Lindus, not just news?", "options": ["Lilly completes its acquisition of AtaiBeckley", "Connect Biopharma reports a positive Phase 2 with a year of cash left", "A trade body publishes a women's health funding report"], "answer": 1, "why": "A fresh readout plus a short runway is the moment a trial-running partner matters. An acquisition closes the door; a report is context."}]}, {"id": "who-exactly", "nav": "Who exactly", "kicker": "Lesson 4", "title": "Who exactly?", "idea": "Write to the person who runs partnering, then bring in the person who signs. In small biotechs people leave after every failed trial, so check they are still there first.", "blocks": [{"type": "principle", "name": "Champion vs economic buyer", "body": "The {{champion}} at a licensor is the head of BD, who wants a deal done. The {{economic buyer}} is the CEO with the board, who decides whether giving up rights beats raising money. Win the first with speed and a clean term sheet; win the second with a trial plan and a timeline."}, {"type": "table", "heading": "The roles to reach", "columns": ["Role", "Where they sit", "What they care about", "How to find them"], "rows": [["Chief Business Officer / head of BD", "Executive team page", "A credible partner that can close before cash runs out", "Leadership page; named in deal and partnering releases; conference partnering lists"], ["CEO", "Executive team page, earnings calls", "Funding the next step without a dilutive raise", "Quarterly results release (quoted by name); annual report"], ["Chief Medical Officer", "Executive team page", "Whether Lindus can run the next trial fast and clean", "Leadership page; trial registry entries; conference posters"], ["Board chair or lead investor", "Board page, proxy statement", "Getting value from the asset", "Proxy filing; the investor's portfolio page"], ["Head of global BD (Asian owners)", "International or US office", "A Western partner with trial capacity in the US and Europe", "English-language releases; US subsidiary team page"]]}, {"type": "steps", "heading": "Check a person still works there", "items": ["Find them on the company's own leadership page today, not in an old release.", "Check their public profile lists this company as current, with the same domain.", "Look for something recent: quoted in a release, a conference talk, or a post in the last 90 days.", "After a failed trial or a merger, check again: teams change fast (Neumora cut 35% of staff in June [s49]).", "Write to two people per account: BD and the CEO or CMO."]}, {"type": "callout", "tone": "tip", "title": "The faster version", "body": "Otto can find and verify the people in each role at your 15 accounts, checked against their current employer."}, {"type": "exercise", "title": "Check one person", "body": "Pick Connect Biopharma. Find the person who runs business development and the CEO on its own site, then confirm both still list Connect as their current employer. Note the date you checked."}]}, {"id": "say", "nav": "What to say", "kicker": "Lesson 5", "title": "What do you say?", "idea": "The first message is about their asset and their problem, not about Lindus. Prove you read their news, make one point, ask one easy question.", "blocks": [{"type": "principle", "name": "Problem before product", "body": "A biotech CEO gets pitched by CROs and bankers every week. What they have not heard is someone who read last week's readout and last quarter's cash line and put the two together. Lead with that, and let Lindus's record come up in the reply."}, {"type": "compare", "left": {"label": "The message everyone sends", "body": "Hi Sam, hope you're well! I'm reaching out from Lindus Therapeutics, a next-generation drug development company backed by Peter Thiel. We pair proprietary AI asset selection with an integrated trial platform to reach value inflection points faster. Would you be open to a quick 30-minute call next week to explore potential synergies?"}, "right": {"label": "Yours, to Connect Biopharma", "body": "Hi [first name], saw Seabreeze STAT cut treatment failure by 66% in acute asthma, with the COPD readout due this month.\n\nThe next step is a Phase 3, and the last quarterly report showed $31.5M in cash.\n\nIs that Phase 3 something you plan to fund alone, or would you look at a partner who runs the trial and shares the upside?", "notes": "Opens on their 15 September readout [s38] and their own cash figure [s39]. One either/or question they can answer from memory. No call ask, no investor names, no \"AI\"."}}, {"type": "steps", "heading": "The rules applied", "items": ["Open on their signal, with a number from their own release.", "Say why it matters from their side in one sentence.", "Ask one either/or question.", "Under 90 words; no meeting ask, no hype words.", "Send in the signal's window: this one is fresh until mid-December."]}], "quiz": [{"q": "Which opening line gets a reply from a biotech CEO?", "options": ["\"Hope you're well! Lindus is a next-generation drug developer.\"", "\"We're backed by Peter Thiel and Bob Langer.\"", "\"Saw the Phase 2 cut treatment failure by 66%; the Phase 3 is next.\""], "answer": 2, "why": "It is about them, it is specific, and it shows you read their news. The other two are about Lindus."}]}, {"id": "lab", "nav": "Model lab", "kicker": "Lesson 6", "title": "Which Claude model for which job?", "idea": "Sorting and extracting at volume doesn't need the biggest model; judgement calls do. We measured it on this course's own accounts.", "blocks": [{"type": "principle", "name": "Match the tool to the job", "body": "Lindus will screen hundreds of assets to sign four or five. Screening is volume work; the final call on a licence is expensive to get wrong. Use the cheapest model that sorts well, and the best one where a mistake costs a deal."}, {"type": "modellab", "task": "Sort 15 real companies into fit / no fit as licensors for Lindus Therapeutics, with a one-line reason. 10 passed our checks, 5 failed them.", "measured": true, "runs": [{"model": "claude-haiku-4-5", "label": "Haiku 4.5", "latency_s": 5.33, "input_tokens": 1752, "output_tokens": 578, "cost_usd": 0.004642, "output": "| Company | Fit? | Reason |\n|---|---|---|\n| Upstream Bio | No fit | $261.3M cash, clear runway through Phase 3, and no partnering plans announced. |\n| Corbus Pharmaceuticals | Fit | Phase 1b obesity data, Phase 2 planned H1 2027, likely needs capital for parallel oncology trial. |\n| Mithra Pharmaceuticals | No fit | Bankrupt; assets acquired by Gedeon Richter in 2024. |\n| Pila Pharma | Fit | Two Phase 2a trials done, EMA approval for obesity trial, analysts assume more capital needed. |\n| Reviva Pharmaceuticals | Fit | Phase 3 completed, FDA requesting second Phase 3, financing contingent, actively pursuing partnerships. |\n| Terns Pharmaceuticals | No fit | Being acquired by Merck; decision-making no longer theirs. |\n| Skye Bioscience | Fit | Phase 2a obesity completed, merging with Redx, nimacimab to be divested or partnered. |\n| Palatin Technologies | No fit | First IND expected Q4 2026; no human clinical data yet. |\n| Dermata Therapeutics | No fit | Withdrew IND and paused acne drug program in 2025-2026; asset no longer active. |\n| Neumora Therapeutics | No fit | Lead drug failed Phase 3; $147M cash to Q3 2027; no partnering plans announced. |\n| Vistagen | Fit | Fasedienol failed Phase 3, refisolone Phase 2-ready, newly appointed Chief Corporate Development Officer signaling openness to licensing. |\n| D&D Pharmatech | Fit | Phase 2 MASH data positive (May 2026), China rights out, CEO explicitly says aiming to sign licensing deal by year-end. |\n| Connect Biopharma | Fit | Phase 2 asthma efficacy data (Sep 2026), $31.5M cash (~1 year runway), needs Phase 3 funding. |\n| Yarrow Bioscience | Fit | Legacy dermatology BET inhibitors in Phase 1b/2 with psoriasis signal; company signals assets may be sold or licensed. |\n| Aclaris Therapeutics | No fit | Cash to end of 2028; pursuing partnerships only for respiratory programs outside China, not seeking external funding. |", "verdict": "Fastest and cheapest; called a shelved asset and a partner-seeker no fit", "score": "13/15"}, {"model": "claude-sonnet-5", "label": "Sonnet 5", "latency_s": 17.08, "input_tokens": 2432, "output_tokens": 1807, "cost_usd": 0.022934, "output": "| Company | Fit? | Reason |\n|---|---|---|\n| Upstream Bio | No fit | Well-funded, plans its own Phase 3 trials with no partnering intent stated |\n| Corbus Pharmaceuticals | No fit | Phase 1b obesity data exists but company is funding its own next trial with no stated need for a partner |\n| Mithra Pharmaceuticals | No fit | Bankrupt and its assets already acquired by Gedeon Richter |\n| Pila Pharma | Fit | Phase 2a obesity/diabetes asset with human data, likely needs additional capital to proceed |\n| Reviva Pharmaceuticals | Fit | Phase 3-stage schizophrenia asset, cash-constrained, explicitly pursuing partnerships |\n| Terns Pharmaceuticals | No fit | Being acquired by Merck, so decision no longer theirs |\n| Skye Bioscience | Fit | Phase 2a obesity antibody with human data being divested/partnered after merger |\n| Palatin Technologies | No fit | Rare genetic obesity focus with no human data yet |\n| Dermata Therapeutics | Fit | Positive Phase 3 acne asset shelved after company pivot to consumer skincare |\n| Neumora Therapeutics | No fit | Lead asset failed and discontinued; remaining program is self-funded with no partnering plans |\n| Vistagen | Fit | Phase 2-ready women's health asset (refisolone) with new licensing-focused hire |\n| D&D Pharmatech | Fit | Phase 2 MASH asset with human data, Asian company seeking ex-China/world partner |\n| Connect Biopharma | Fit | Phase 2 asthma antibody with human data, short cash runway, needs partner for Phase 3 |\n| Yarrow Bioscience (ex-VYNE) | Fit | Phase 1b dermatology asset with human data now up for sale or license after pivot |\n| Aclaris Therapeutics | Fit | Phase 1b/2 respiratory/dermatology antibodies with human data, explicitly seeking strategic partnerships |", "verdict": "Caught every trap; disputed Corbus, and implied a funding fact not given", "score": "14/15"}, {"model": "claude-opus-5-5", "label": "Opus 5.5", "latency_s": 14.88, "input_tokens": 2434, "output_tokens": 1741, "cost_usd": 0.044556, "output": "| Company | Fit? | Reason |\n|---|---|---|\n| Upstream Bio | No fit | Has $261.3M and runway through 2027 to run its own Phase 3s, with no partnering plans announced. |\n| Corbus Pharmaceuticals | No fit | Plans to run the obesity Phase 2 itself, with no stated cash gap or partner search; priority is a registrational oncology trial. |\n| Mithra Pharmaceuticals | No fit | Went bankrupt in 2024, and Gedeon Richter acquired its estetrol assets. |\n| Pila Pharma | Fit | Obesity/T2D drug has two Phase 2a trials done and only part of the next trial funded, so more capital is needed. |\n| Reviva Pharmaceuticals | Fit | Schizophrenia Phase 3 depends on new financing; the company moved to OTCQB and is openly pursuing partnerships. |\n| Terns Pharmaceuticals | No fit | Merck is acquiring it, so the metabolic assets are no longer its decision. |\n| Skye Bioscience | Fit | Obesity antibody has Phase 2a data and will be divested or partnered after the company refocuses on fibrosis. |\n| Palatin Technologies | No fit | Targets rare genetic obesities and has no human data on the new molecules. |\n| Dermata Therapeutics | Fit | Acne drug has positive Phase 3 data, but the program is paused after the pivot to consumer skincare. |\n| Neumora Therapeutics | No fit | Is funding its own next Phase 2 into Q3 2027 and has announced no partnering plans. |\n| Vistagen | Fit | Has a Phase 2-ready menopausal hot-flash drug after its lead drug missed Phase 3, cash only into 2027, and a new licensing-focused BD chief. |\n| D&D Pharmatech | Fit | MASH drug hit its Phase 2 endpoints, and the company is actively seeking a licensee for rights outside China. |\n| Connect Biopharma | Fit | Has a positive Phase 2 in acute asthma attacks but only about one year of cash, and needs a Phase 3 next. |\n| Yarrow Bioscience (formerly VYNE) | Fit | Legacy dermatology BET inhibitor with a Phase 1b psoriasis signal may be sold or licensed after the merger (note the partial clinical hold). |\n| Aclaris Therapeutics | Fit | Has Phase 1b/2 asthma and atopic dermatitis assets and says it is seeking partners for respiratory programs outside China. |", "verdict": "Caught every trap; disputed Corbus with the clearest, most careful reasons", "score": "14/15"}], "takeaway": "All three models caught every disqualifier: the Merck buyout, the bankruptcy, the cash-rich companies and the rare-disease focus. Haiku lost two real fits because it read \"program paused\" and \"funded but seeking partners\" as reasons to walk away, which is backwards for an in-licenser. Sonnet and Opus only disagreed with our key on Corbus, and they have a point: the line shows a fresh readout but no stated cash gap or partner search, so our \"fit\" was a timing judgement. Sonnet matched Opus for about half the price, so it is the default for sorting; use Haiku only as a first pass with a human reading its no-fits."}, {"type": "text", "body": "Total cost of the lab: $0.0721, run on 24 September 2026 with the list prices in model-lab.json (checked the same day) [s57]. Prices change, so re-check before you plan a budget."}, {"type": "table", "heading": "Which model for which job", "columns": ["Job", "Model", "Why"], "rows": [["Sorting candidate licensors against the ICP", "Sonnet 5", "14/15 in the lab, same as Opus, at about half the cost"], ["Pulling phase, cash runway and rights out of filings", "Haiku 4.5", "Fast and cheap for extraction; the lab showed it misreads nuance, so a human checks its no-fits"], ["Drafting first messages at volume", "Sonnet 5", "Good writing, runs often, cost adds up"], ["The ICP decision, notes to your top five, grading the agent", "Opus 5.5", "Few calls, and the costly mistakes happen here"]]}, {"type": "text", "body": "Every current model also takes an effort setting, from low to max. A bigger model on low effort is sometimes a better trade than a smaller model."}]}, {"id": "agent", "nav": "Make it an agent", "kicker": "Lesson 7", "title": "Can this run without me?", "idea": "Everything in lessons 1 to 5 can run every week. An agent is a model with instructions, tools and a way to check its own work; Claude Managed Agents hosts it on your schedule and grades each run against a rubric.", "blocks": [{"type": "principle", "name": "Systems beat heroics", "body": "Readouts and runway warnings land every week across these 15 companies. A Monday check you never skip will catch Connect-style windows that a quarterly push misses. Put the watching on a schedule and spend your time on the calls."}, {"type": "pipeline", "steps": [{"icon": "🗓️", "label": "On your schedule", "detail": "Scheduled deployment, weekday mornings by default"}, {"icon": "🤖", "label": "Agent", "detail": "Your licensor ICP, five signals and message rules"}, {"icon": "🔎", "label": "Tools", "detail": "Web search and fetch on releases, filings and news"}, {"icon": "🎯", "label": "Grader", "detail": "Checks sources, dates, independence and drafts against the rubric"}, {"icon": "📄", "label": "Report", "detail": "New signals on your 15 accounts, each with a draft note"}]}, {"type": "code", "body": "cd agent\ncp .env.example .env     # paste your Anthropic API key\nbash launch.sh           # creates the agent and schedule, runs once now\npython3 report.py        # when the run finishes: downloads the report", "caption": "The kit is in agent/. MODEL is set to Sonnet 5 because it matched Opus in the lab at about half the price."}, {"type": "callout", "tone": "tip", "title": "Cost and control", "body": "Each run reads news and filings for 15 companies, so cost grows with the list; each run's cost shows in the Console, and RUN_BUDGET_CENTS in .env is a hard cap per run. The agent only writes a report: it sends nothing and contacts no one. The kit can also connect Otto for verified contacts at each account with a signal."}, {"type": "callout", "tone": "warning", "title": "Keep trial data out of it", "body": "Lindus runs clinical trials, which involve patient health data. This agent only reads public web data. Never give it trial, patient or partner data-room files."}], "quiz": [{"q": "The agent's first run flags Terns as \"ready\" because of its partnering news, but Merck bought Terns in May. What do you change so it doesn't happen again?", "options": ["The instructions", "The rubric", "The schedule"], "answer": 1, "why": "Add a rubric line that every reported company must still be independent, so the grader sends the run back when it isn't. Instructions help, but only the rubric makes it a checked rule."}]}, {"id": "next", "nav": "What next", "kicker": "Lesson 8", "title": "What happens next?", "idea": "A list and a message are a plan. Pipeline comes from sending, following up, handling replies and learning which assets say yes.", "blocks": [{"type": "principle", "name": "Founder-led sales first", "body": "The first five licences will be won by the CEO, the VP of Corporate Development and the CMO in the room, not by a sequence. Only they can change the deal shape, from an option to a co-development to a SpinCo, in the same call [s1]. Automate the watching and the first touch; keep the conversations."}, {"type": "stack", "layers": [{"name": "Positioning and ICP", "detail": "The licensor, who signs, and the alternative (a dilutive raise)", "owner": "course"}, {"name": "Target accounts", "detail": "15 checked licensors, tiered by fit and timing", "owner": "course"}, {"name": "Buying signals", "detail": "Readouts, funding gaps, pivots, watched on your schedule", "owner": "course"}, {"name": "The right people", "detail": "BD heads and CEOs, confirmed at their current company", "owner": "otto"}, {"name": "Outreach", "detail": "Sequences on LinkedIn and email, sent once you approve", "owner": "otto"}, {"name": "Replies", "detail": "Sorted by intent, with drafts to approve", "owner": "otto"}, {"name": "Calls, diligence and term sheets", "detail": "Data rooms, trial plans, deal terms", "owner": "you"}, {"name": "Pipeline and learning", "detail": "Results synced to the CRM; every no feeds back into lesson 1", "owner": "otto"}]}, {"type": "table", "heading": "From plan to pipeline", "columns": ["Step", "This course", "Otto"], "rows": [["Decide who buys (ICP, personas)", "✓ lesson 1", "Keeps the ICP and scores new accounts against it"], ["Build the account list", "✓ lesson 2, checked once", "Company search against the ICP, kept in a workbook"], ["Watch for buying signals", "✓ lesson 3, then the agent on your schedule", "Signal Agents watching the accounts continuously"], ["Find the right people", "Method only (lesson 4)", "Verified people and their current employer"], ["Write the first message", "✓ one example (lesson 5)", "A sequence per account: first message plus follow-ups"], ["Send it, follow up, stop when they reply", "Next step →", "Campaigns on LinkedIn and email, paced within daily limits"], ["Handle replies", "Next step →", "Inbox triage and reply drafts"], ["Track what works", "Next step →", "Campaign performance: accepts, replies, reply rate"], ["Keep the CRM up to date", "Next step →", "Pushes companies and contacts to a connected CRM without duplicates"]]}, {"type": "steps", "heading": "Setting up a campaign in Otto from this course", "items": ["Bring the accounts in: import the lesson 2 table into a workbook named after this course, with each domain so Otto matches existing companies.", "Bring the people in: add the BD heads and CEOs you verified, as a dry run first; every person should attach to one of the 15 companies, with no new companies created.", "Pick a sequence: create a draft campaign from a template. Nothing launches yet.", "Write the steps: the lesson 5 message as step 1, then one or two follow-ups that each bring a new fact (the COPD readout, a trial timeline), not a repeat.", "Enrol and schedule: add the workbook, set send days, window, time zone and a daily cap.", "Check before launch: run the pre-launch check for missing leads, empty copy, no connected mailbox or LinkedIn account, or no schedule.", "Launch when you're ready, yourself. Replies land in Otto's inbox, sorted, with drafts for your approval."]}, {"type": "callout", "tone": "tip", "title": "Nothing sends until you launch it", "body": "This course made no campaign and sent nothing. Start at [otto-pilot.io](https://otto-pilot.io) when you want the sending, follow-up and replies handled."}], "quiz": [{"q": "The pre-launch check says \"no mailbox that can see replies\". What happens if you try to launch anyway?", "options": ["It sends and you miss the replies", "Otto refuses to launch until the blocker is fixed", "It launches on LinkedIn only"], "answer": 1, "why": "The pre-launch check blocks launch until the missing piece is fixed."}]}]}</script>
<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("course-data").textContent); }
  catch (e) { document.getElementById("main").textContent = "course.json could not be read: " + e.message; return; }

  var glossary = data.glossary || {};
  var sources = {};
  (data.sources || []).forEach(function (s, i) { sources[s.id] = { n: i + 1, url: s.url, title: s.title }; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function unesc(s) {
    return String(s).replace(/&(amp|lt|gt|quot|#39);/g, function (_, e) { return { amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e]; });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#"; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function clamp01(v) { return Math.max(0, Math.min(1, num(v))); }

  // Inline markup on escaped text: **bold**, `code`, [text](https://…), {{Term}}, [s1] / [s1, s2]
  function md(s) {
    var t = esc(s);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, a, u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + a + "</a>"; });
    t = t.replace(/\{\{([^}]+)\}\}/g, function (_, term) {
      var def = glossary[unesc(term)];
      return def ? '<span class="term" tabindex="0" data-def="' + esc(def) + '">' + term + "</span>" : term;
    });
    t = t.replace(/\[(s\d+(?:\s*,\s*s\d+)*)\]/g, function (_, ids) {
      var links = ids.split(/\s*,\s*/).map(function (id) {
        var s = sources[id];
        return s ? '<a href="#src-' + id + '" title="' + esc(s.title) + '">' + s.n + "</a>" : "";
      }).filter(Boolean);
      return links.length ? '<sup class="src">' + links.join(", ") + "</sup>" : "";
    });
    return t;
  }
  function markLast(h) { return /<[^>]+>/.test(h) ? h : h.replace(/(\S+)\s*$/, '<span class="mk">$1</span>'); }
  function paras(s) { return String(s || "").split(/\n{2,}/).map(function (p) { return "<p>" + md(p) + "</p>"; }).join(""); }
  var TONES = { accent: "", amber: "t-amber", red: "t-red", good: "t-good", otto: "t-otto" };

  var R = {
    text: function (b) { return paras(b.body); },
    stats: function (b) {
      return '<div class="stats">' + (b.items || []).map(function (s) {
        return '<div><div class="v">' + esc(s.value) + '</div><div class="l">' + md(s.label) + "</div></div>";
      }).join("") + "</div>";
    },
    principle: function (b) {
      return '<div class="principle"><span class="badge">Principle</span><div><h3>' + md(b.name) + "</h3><p>" + md(b.body) + "</p>" +
        (b.source ? '<div class="src">' + md(b.source) + "</div>" : "") + "</div></div>";
    },
    cards: function (b) {
      return '<div class="cards">' + (b.items || []).map(function (c) {
        return '<div class="card">' + (c.tag ? '<span class="tag ' + esc(c.tone || "") + '">' + esc(c.tag) + "</span>" : "") +
          "<h3>" + md(c.title) + "</h3><p>" + md(c.body) + "</p></div>";
      }).join("") + "</div>";
    },
    fields: function (b) {
      return '<div class="fields">' + (b.items || []).map(function (f) {
        return '<div><div class="k">' + esc(f.label) + '</div><div class="v">' + md(f.value) + "</div></div>";
      }).join("") + "</div>";
    },
    table: function (b) {
      var cols = b.columns || [], nm = b.numeric || [];
      return '<div class="table-wrap"><table><thead><tr>' + cols.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") +
        "</tr></thead><tbody>" + (b.rows || []).map(function (r) {
          return "<tr>" + r.map(function (c, i) { return "<td" + (nm.indexOf(i) > -1 ? ' class="num"' : "") + ">" + md(c) + "</td>"; }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>" + (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "");
    },
    callout: function (b) {
      return '<div class="callout ' + esc(b.tone || "tip") + '"><div class="t">' + md(b.title) + "</div>" + paras(b.body) + "</div>";
    },
    bars: function (b) {
      var items = b.items || [], max = Math.max.apply(null, items.map(function (i) { return num(i.value); }).concat([1e-9]));
      return '<div class="chart"><div class="bars">' + items.map(function (i) {
        var w = (100 * num(i.value) / max).toFixed(1);
        return '<div class="bar-row"><div class="lb">' + md(i.label) + (i.note ? "<small>" + md(i.note) + "</small>" : "") + '</div>' +
          '<div class="tr" role="img" aria-label="' + esc(i.label) + ": " + esc(i.value) + '"><div class="fl ' + (TONES[i.tone] || "") + '" style="width:' + w + '%"></div></div>' +
          '<div class="vl">' + esc(i.value) + (b.unit ? esc(b.unit) : "") + "</div></div>";
      }).join("") + "</div>" + (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "") + "</div>";
    },
    funnel: function (b) {
      var st = b.stages || [], max = Math.max.apply(null, st.map(function (s) { return num(s.value); }).concat([1e-9]));
      return '<div class="chart"><div class="funnel">' + st.map(function (s) {
        var w = Math.max(28, 100 * num(s.value) / max).toFixed(1);
        return '<div class="fn-row"><div class="fn-bar" style="width:' + w + '%"><span>' + md(s.label) + "</span><b>" + esc(s.value) + "</b></div>" +
          (s.note ? '<div class="fn-note">' + md(s.note) + "</div>" : "") + "</div>";
      }).join("") + "</div>" + (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "") + "</div>";
    },
    timeline: function (b) {
      return '<div class="chart"><ol class="timeline">' + (b.items || []).map(function (i) {
        return '<li><div class="d">' + esc(i.date) + '</div><div class="h">' + md(i.title) + "</div>" + (i.note ? '<div class="x">' + md(i.note) + "</div>" : "") + "</li>";
      }).join("") + "</ol>" + (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "") + "</div>";
    },
    matrix: function (b) {
      var x = b.x || {}, y = b.y || {}, q = b.quadrants || {};
      var dots = (b.items || []).map(function (i) {
        return '<div class="mx-dot" style="left:' + (6 + 88 * clamp01(i.x)).toFixed(1) + "%;bottom:" + (6 + 88 * clamp01(i.y)).toFixed(1) + '%"><i aria-hidden="true"></i>' + esc(i.label) + "</div>";
      }).join("");
      return '<div class="chart"><div class="matrix" role="img" aria-label="' + esc((y.label || "") + " by " + (x.label || "")) + '">' +
        '<span class="mx-q tl">' + esc(q.tl || "") + '</span><span class="mx-q tr">' + esc(q.tr || "") + '</span><span class="mx-q bl">' + esc(q.bl || "") + '</span><span class="mx-q br">' + esc(q.br || "") + "</span>" + dots + "</div>" +
        '<div class="mx-axes"><span>← ' + esc(x.low || "") + '</span><span><b>' + esc(x.label || "") + "</b> · up: " + esc(y.label || "") + "</span><span>" + esc(x.high || "") + " →</span></div>" +
        (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "") + "</div>";
    },
    stack: function (b) {
      var OWN = { course: "This course", otto: "Otto", you: "You" };
      return '<div class="stack">' + (b.layers || []).map(function (l, i) {
        var o = OWN[l.owner] ? l.owner : "course";
        return '<div class="st-row o-' + o + '"><span class="no">' + String(i + 1).padStart(2, "0") + '</span><div><div class="nm">' + md(l.name) + '</div><div class="dt">' + md(l.detail) + '</div></div><span class="ow">' + esc(l.label || OWN[o]) + "</span></div>";
      }).join("") + '</div><div class="st-legend"><span><i style="background:var(--ink)"></i>This course</span><span><i style="background:var(--otto)"></i>Otto</span><span><i style="background:var(--mark);box-shadow:0 0 0 1.5px var(--sketch)"></i>You</span></div>' +
        (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : "");
    },
    signals: function (b) {
      return '<div class="signals">' + (b.items || []).map(function (s) {
        var ex = "";
        if (s.example && s.example.none) ex = '<div class="ex">No live example this week. ' + md(s.example.note || "") + "</div>";
        else if (s.example) ex = '<div class="ex"><b>' + md(s.example.company) + ":</b> " + md(s.example.fact) +
          (s.example.date ? ' <span style="color:var(--ink-3)">(' + esc(s.example.date) + ")</span>" : "") + "</div>";
        return '<div class="signal"><div><h3>' + md(s.name) + '</h3><p class="watch">' + md(s.watch) + "</p></div><div>" +
          '<p class="why">' + md(s.why) + "</p>" + ex + "</div></div>";
      }).join("") + "</div>";
    },
    compare: function (b) {
      function side(x, cls) {
        return '<div class="' + cls + '"><div class="lbl">' + esc(x.label) + '</div><div class="body">' + md(x.body) + "</div>" +
          (x.notes ? '<div class="notes">' + md(x.notes) + "</div>" : "") + "</div>";
      }
      return '<div class="compare">' + side(b.left || {}, "bad") + side(b.right || {}, "good") + "</div>";
    },
    modellab: function (b) {
      var runs = b.runs || [];
      var maxC = Math.max.apply(null, runs.map(function (r) { return num(r.cost_usd); }).concat([1e-9]));
      var maxT = Math.max.apply(null, runs.map(function (r) { return num(r.latency_s); }).concat([1e-9]));
      var bars = runs.map(function (r) {
        return '<div class="lab-row"><div class="name">' + esc(r.label || r.model) + (r.score != null ? ' <span class="score">' + esc(r.score) + "</span>" : "") +
          '</div><div class="bars2"><div class="bar" style="width:' + Math.max(1, 100 * num(r.cost_usd) / maxC).toFixed(1) + '%"></div>' +
          '<div class="bar-l">$' + num(r.cost_usd).toFixed(4) + " · " + num(r.input_tokens) + " in / " + num(r.output_tokens) + ' out</div>' +
          '<div class="bar t" style="width:' + Math.max(1, 100 * num(r.latency_s) / maxT).toFixed(1) + '%"></div>' +
          '<div class="bar-l">' + num(r.latency_s).toFixed(1) + " s</div></div></div>";
      }).join("");
      var outs = runs.map(function (r) {
        return '<div class="card"><span class="tag accent">' + esc(r.model) + "</span><h3>" + md(r.verdict || "") + "</h3><pre>" + esc(r.output || "") + "</pre></div>";
      }).join("");
      return '<div class="chart">' + (b.task ? "<p><b>The task:</b> " + md(b.task) + "</p>" : "") +
        '<div class="legend"><span><i style="background:var(--ink)"></i>cost per run</span><span><i style="background:var(--ink-3)"></i>time</span>' +
        (b.measured === false ? "<span>timing only, costs not measured</span>" : "") + "</div>" +
        '<div class="lab-bars">' + bars + "</div></div>" + '<div class="outputs">' + outs + "</div>" +
        (b.takeaway ? '<div class="callout tip" style="margin-top:14px"><div class="t">Takeaway</div>' + paras(b.takeaway) + "</div>" : "");
    },
    pipeline: function (b) {
      return '<div class="pipeline">' + (b.steps || []).map(function (s, i) {
        return (i ? '<div class="pipe-arrow" aria-hidden="true">→</div>' : "") + '<div class="pipe-step"><div class="ic" aria-hidden="true">' + esc(s.icon || "") +
          '</div><div class="lb">' + md(s.label) + '</div><div class="dt">' + md(s.detail) + "</div></div>";
      }).join("") + "</div>";
    },
    code: function (b) { return '<pre class="code"><code>' + esc(b.body) + "</code></pre>" + (b.caption ? '<div class="caption">' + md(b.caption) + "</div>" : ""); },
    steps: function (b) { return '<ol class="steps">' + (b.items || []).map(function (s) { return "<li>" + md(s) + "</li>"; }).join("") + "</ol>"; },
    exercise: function (b) { return '<div class="exercise"><div class="t">Try it: ' + md(b.title) + "</div>" + paras(b.body) + "</div>"; }
  };

  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var doneKey = "agentic-gtm:" + (data.company && data.company.name || "x") + ":done";
  var done = {}; try { done = JSON.parse(store.get(doneKey) || "{}") || {}; } catch (e) {}

  var c = data.company || {};
  document.title = data.title || ("How to sell " + (c.name || "your startup"));
  var html = '<header class="hero"><div class="eyebrow">Go-to-market course · built from ' + esc(c.url || "your site") + "</div>" +
    "<h1>" + md(data.title || ("How to sell " + (c.name || "your startup"))) + "</h1>" +
    '<p class="lede">' + md(data.lede || c.one_liner || "") + "</p>" +
    ((data.meta || []).length ? R.stats({ items: data.meta.map(function (m) { return { value: m.value, label: m.label }; }) }) : "") + "</header>";

  var toc = "";
  (data.lessons || []).forEach(function (L, i) {
    var id = "l-" + (L.id || i);
    toc += '<li><a href="#' + id + '" data-id="' + esc(L.id || i) + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(L.nav || L.title) +
      '</span><span class="done" aria-label="done">' + (done[L.id] ? "✓" : "") + "</span></a></li>";
    html += '<section class="lesson" id="' + id + '"><div class="kicker">' + esc(L.kicker || ("Lesson " + (i + 1))) + "</div><h2>" + markLast(md(L.title)) + "</h2>";
    if (L.idea) html += '<p class="idea">' + md(L.idea) + "</p>";
    (L.blocks || []).forEach(function (b) {
      var r = R[b.type]; if (!r) return;
      html += '<div class="block">' + (b.heading ? '<div class="block-title">' + esc(b.heading) + "</div>" : "") + r(b) + "</div>";
    });
    (L.quiz || []).forEach(function (q) {
      html += '<div class="quiz" data-lesson="' + esc(L.id) + '" data-answer="' + (q.answer | 0) + '"><div class="q">' + md(q.q) + "</div>" +
        (q.options || []).map(function (o, oi) { return '<button class="opt" type="button" data-i="' + oi + '">' + md(o) + "</button>"; }).join("") +
        '<div class="why">' + md(q.why) + "</div></div>";
    });
    html += "</section>";
  });

  html += '<footer class="sources">';
  if ((data.sources || []).length) {
    html += '<div class="block-title">Sources</div><ol>' + data.sources.map(function (s) {
      return '<li id="src-' + esc(s.id) + '"><a href="' + safeUrl(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a></li>";
    }).join("") + "</ol>";
  }
  html += '<div class="credit">' + md(data.credit || "Made with [agentic-gtm](https://github.com/Amaan-creates/agentic-gtm), a Claude skill.") + "</div></footer>";

  document.getElementById("main").innerHTML = html;
  document.getElementById("toc").innerHTML = toc;

  document.querySelectorAll(".quiz").forEach(function (qz) {
    qz.addEventListener("click", function (e) {
      var btn = e.target.closest("button.opt"); if (!btn || qz.classList.contains("answered")) return;
      var ans = +qz.dataset.answer;
      qz.querySelectorAll("button.opt").forEach(function (b) {
        b.disabled = true;
        if (+b.dataset.i === ans) b.classList.add("right");
        else if (b === btn) b.classList.add("wrong");
      });
      qz.classList.add("answered");
      var lesson = qz.dataset.lesson, all = document.querySelectorAll('.quiz[data-lesson="' + lesson + '"]');
      if (Array.prototype.every.call(all, function (q) { return q.classList.contains("answered"); })) {
        done[lesson] = 1; store.set(doneKey, JSON.stringify(done));
        var mark = document.querySelector('nav.toc a[data-id="' + lesson + '"] .done'); if (mark) mark.textContent = "✓";
      }
    });
  });

  var links = Array.prototype.slice.call(document.querySelectorAll("nav.toc a"));
  var secs = links.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); });
  var bar = document.getElementById("progress");
  function onScroll() {
    var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? h.scrollTop / max : 0).toFixed(4) + ")";
    var cur = 0; secs.forEach(function (s, i) { if (s && s.getBoundingClientRect().top < 140) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle("active", i === cur); });
  }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  var saved = store.get("agentic-gtm:theme"); if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById("theme").addEventListener("click", function () {
    var dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("agentic-gtm:theme", next);
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input,textarea,button")) return;
    var cur = links.findIndex(function (a) { return a.classList.contains("active"); });
    if (e.key === "j" || e.key === "ArrowRight") { var n = links[Math.min(links.length - 1, cur + 1)]; if (n) n.click(); }
    if (e.key === "k" || e.key === "ArrowLeft") { var p = links[Math.max(0, cur - 1)]; if (p) p.click(); }
  });
})();
</script>
</body>
</html>
